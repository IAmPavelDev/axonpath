# Axon — AWS beta stack (t2.micro, auto-assigned public IP, plain HTTP).
# Services: Postgres, Qdrant, backend. The app talks directly to
# http://<EC2-PUBLIC-IP>:3001 (Android cleartext enabled). SG inbound: SSH 22
# (your IP) + TCP 3001. Never stop/start the instance — the public IP changes
# on stop/start and is baked into the APK.
#
# Run:  docker compose --env-file .env.aws -f docker-compose-prod.yaml up -d
# Conf: cp .env.aws.example .env.aws and fill every value before launching.
# NOTE: no --build here — the image is built on the dev machine (pnpm
# backend:image) and shipped via docker save/load (1 GiB server can't build).
services:
  db:
    image: postgres:18
    container_name: axon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-axon}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - axon-network

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: axon-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - axon-network

  backend:
    # Image is built on the dev machine (pnpm backend:image) and shipped via
    # docker save/load — the t3.micro server must never run `--build` (OOM).
    image: axon-backend:local
    container_name: axon-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env.aws
    environment:
      - NODE_ENV=production
      - APP_PORT=3001
      - APP_HOST=0.0.0.0
    # Published publicly: the phone reaches http://<EC2-PUBLIC-IP>:3001 directly.
    # Guarded by the security group; DB/Qdrant stay internal-only.
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - axon-network

volumes:
  db_data:
  qdrant_data:
  qdrant_snapshots:

networks:
  axon-network:
    driver: bridge
