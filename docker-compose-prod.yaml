services:
  backend:
    container_name: axon-backend-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${APP_PORT:-3001}
      - HOST=${APP_HOST:-0.0.0.0}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL required}
      - QDRANT_URL=${QDRANT_URL:?QDRANT_URL required}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "3001:3001"
    networks:
      - axon-network
    restart: always

networks:
  axon-network:
    driver: bridge
