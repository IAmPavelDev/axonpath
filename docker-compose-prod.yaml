# Axon — AWS beta stack (t2.micro, auto-assigned public IP, plain HTTP).
# Services: Postgres, Qdrant, backend. The app talks directly to
# http://<EC2-PUBLIC-IP>:3001 (Android cleartext enabled). SG inbound: SSH 22
# (your IP) + TCP 3001. Never stop/start the instance — the public IP changes
# on stop/start and is baked into the APK.
#
# Run:  docker compose --env-file .env.aws -f docker-compose-prod.yaml up -d
# Conf: cp .env.aws.example .env.aws and fill every value before launching.
# NOTE: no --build here — the image is built on the dev machine (pnpm
# backend:image) and shipped via docker save/load (1 GiB server can't build).
services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: axon-rabbitmq
    restart: unless-stopped
    # Management UI: http://localhost:15672 (localhost-only binding).
    environment:
      RABBITMQ_DEFAULT_USER: axon
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD required}
    ports:
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - axon-network

  db:
    image: postgres:18
    container_name: axon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-axon}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - axon-network

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: axon-qdrant
    restart: unless-stopped
    # Dashboard: http://localhost:6333/dashboard (localhost-only binding).
    ports:
      - '127.0.0.1:6333:6333'
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - axon-network

  backend:
    # Image is built on the dev machine (pnpm backend:image) and shipped via
    # docker save/load — the t3.micro server must never run `--build` (OOM).
    image: axon-backend:local
    container_name: axon-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.aws
    environment:
      - NODE_ENV=production
      - APP_PORT=3001
      - APP_HOST=0.0.0.0
      - JOB_QUEUE_TRANSPORT=rabbit
      - RABBITMQ_URL=amqp://axon:8IAtX8kABUhw71zyMoDc1I@rabbitmq:5672
      # Node's happy-eyeballs blackholes on the z.ai Aliyun CDN inside the
      # docker bridge (undici ETIMEDOUT on all addresses; raw IPv4 sockets
      # work). Single-address IPv4-first connect fixes it. See RUNBOOK.
      - NODE_OPTIONS=--no-network-family-autoselection
    # Published publicly: the phone reaches the API through the ngrok tunnel
    # bound to localhost:3001. DB/Qdrant/RabbitMQ stay internal-only.
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - axon-network

  worker:
    # Same image, different entrypoint: RabbitMQ consumer only. Generation
    # survives API restarts — messages wait durably in the broker.
    image: axon-backend:local
    container_name: axon-worker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env.aws
    environment:
      - NODE_ENV=production
      - JOB_QUEUE_TRANSPORT=rabbit
      - RABBITMQ_URL=amqp://axon:8IAtX8kABUhw71zyMoDc1I@rabbitmq:5672
      # See backend service: z.ai CDN blackholes under happy-eyeballs here.
      - NODE_OPTIONS=--no-network-family-autoselection
    command: >
      sh -c 'pnpm exec prisma migrate deploy --schema /app/apps/backend/src/prisma/schema.prisma &&
             node -r /app/apps/backend/alias-register.js /app/apps/backend/dist/src/worker.js'
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "dist/src/worker.js" >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - axon-network

volumes:
  db_data:
  qdrant_data:
  qdrant_snapshots:

networks:
  axon-network:
    driver: bridge
