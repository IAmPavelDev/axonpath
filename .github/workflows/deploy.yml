name: deploy-dev

# Push-to-dev autodeploy: build the lambda image on GitHub runners, push to ECR,
# update both functions, smoke /health. One-time setup: DEPLOY_AWS_SERVERLESS.md §3a.
on:
  push:
    branches: [dev]
    paths:
      - "apps/backend/**"
      - "packages/api-contract/**"
      - "Dockerfile"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REPO: axon-backend
  IMAGE_TAG: lambda
  API_HEALTH_URL: https://t3afkc5pj2.execute-api.eu-central-1.amazonaws.com/health

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push lambda image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lambda
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy axon-api
        run: |
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}"
          aws lambda update-function-code --function-name axon-api \
            --image-uri "$IMAGE_URI" --query 'LastUpdateStatus' --output text
          aws lambda wait function-updated-v2 --function-name axon-api

      - name: Redeploy axon-worker
        run: |
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}"
          aws lambda update-function-code --function-name axon-worker \
            --image-uri "$IMAGE_URI" --query 'LastUpdateStatus' --output text
          aws lambda wait function-updated-v2 --function-name axon-worker

      - name: Smoke /health
        run: |
          for i in 1 2 3; do
            RESP=$(curl -fsS --max-time 30 "$API_HEALTH_URL") && echo "$RESP" && echo "$RESP" | grep -q '"status":"ok"' && exit 0
            echo "attempt $i failed; retrying in 15s" >&2
            sleep 15
          done
          echo "health check failed" >&2
          exit 1
