services:
  backend:
    container_name: axon-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages/api-contract:/app/packages/api-contract
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/packages/api-contract/node_modules

    depends_on:
      db:
        condition: service_started
      qdrant:
        condition: service_started
    env_file:
      - .env
    ports:
      - '3001:3001'
    command: >
      sh -c 'pnpm --filter @axon/backend exec prisma migrate deploy --schema ./src/prisma/schema.prisma &&
            pnpm --filter @axon/backend run prisma:generate &&
            pnpm --filter @axon/backend run dev:watch'
    networks:
      - axon-network
    restart: unless-stopped

  db:
    container_name: axon-db
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: axon
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - axon-network
    ports:
      - '5432:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U postgres -d axon -h 127.0.0.1 -p 5432']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  qdrant:
    container_name: axon-qdrant
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    ports:
      - '6333:6333'
      - '6334:6334'
    networks:
      - axon-network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password

volumes:
  db_data:
  rabbitmq_data:
  qdrant_data:
  qdrant_snapshots:

networks:
  axon-network:
    driver: bridge